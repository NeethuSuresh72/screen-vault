<div class="movie-card">

    <img
        [src]="imageUrl + movie.poster_path"
        [alt]="movie.title">

    <div class="movie-info">

        <h5>{{ movie.title }}</h5>

        <p class="rating">
            ⭐ {{ movie.vote_average | number:'1.1-1' }}/10
        </p>

        <p class="release">
            {{ movie.release_date }}
        </p>

        <a
            class="btn btn-danger w-100"
            [routerLink]="['/movie', movie.id]">

            View Details

        </a>

    </div>

</div>
